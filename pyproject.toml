[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "insight-studio"
version = "0.1.0"
description = "Cross-platform spreadsheet job editor for Cognex In-Sight devices (In-Sight HMI API + PySide6)"
requires-python = ">=3.10"
dependencies = ["PySide6>=6.7"]

[project.scripts]
insight-studio = "insight_studio.__main__:main"

[tool.setuptools.packages.find]
include = ["insight_studio*"]

[tool.setuptools.package-data]
insight_studio = ["data/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
